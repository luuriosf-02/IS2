services:
  # 1. BASE DE DATOS PRINCIPAL (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: app_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. APLICACIÓN DJANGO (Backend Principal)
  web:
    build: .
    container_name: app_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # 3. KEYCLOAK (Autenticación y Gestión de Identidad)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: app_keycloak
    restart: always
    command: start-dev --db=dev-file --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Conexión a PostgreSQL
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Configuración de red
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: "xforwarded"
      # Aumento de tiempo límite para la importación
      #JAVA_OPTS_APPEND: "-Darjuna.system.entity.arjuna.lite.transactionTimeout=1800"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-export:/opt/keycloak/data/import
    depends_on:
      db:
        condition: service_healthy

  # 4. POSTGREST (API REST automática basada en PostgreSQL)
  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: app_postgrest
    restart: always
    environment:
      PGRST_DB_URI: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      PGRST_DB_SCHEMA: ${PGRST_DB_SCHEMA}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # 5. GRAFANA (Monitoreo y Paneles de Control)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: app_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3002:3000" # Se expone en el 3002 para evitar colisión con PostgREST (3000)
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy

  # 6. SERVICIO DNIT / MONITOR DE ENTORNO
  # Nota: Si usas una librería/agente específico para métricas de Postgres o auditoría DNIT,
  # puedes definir su contenedor aquí. Ejemplo genérico o adaptador de logs:
  dnit_collector:
    image: alpine:latest
    container_name: app_dnit
    restart: always
    command: sh -c "echo 'Iniciando colector DNIT/Auditoría...' && tail -f /dev/null"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  keycloak_data:
